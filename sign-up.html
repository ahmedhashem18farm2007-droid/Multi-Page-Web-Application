<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in</title>
    <link rel="stylesheet" href="sign-up.css">
</head>
<body>

    <div class="login_par">
        <h1>My Anime</h1>
        <p>Step into the vast world of anime-log in <br> to rate your favorites, discover hidden gems,<br> and shape the rankings of tomorrow.</p>
    </div>

<div class="login_page">
    <h1>Welcome back</h1>

    <form action="../A7med/A7med.html" method="get">
        <div class="input_box">
            <input type="email" placeholder="Enter your E-mail" required>
        </div>

        <div class="input_box">
            <input type="password" placeholder="Enter your Password" required>
        </div>

        <div class="remember-forgot">
            <label for="check"><input type="checkbox" id="check">Remember me</label>
            <a href="../forget/forget.html">Forgot password?</a>
        </div>

        <button type="submit" class="btn">Sign in</button>

        <p class="noAcc">Don't have an account?
            <a href="../sign-in/sign-in.html">Create new account</a>
        </p>
    </form>
</div>




    
</body>
</html>
