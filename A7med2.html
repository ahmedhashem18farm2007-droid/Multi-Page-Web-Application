<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>My Anime — Manage</title>
  <link rel="stylesheet" href="A7med2.css" />
</head>
<body>
  <div class="header">
      <div class="logo">
        <img src="../image/logo.jpg" />
        <h2>My Anime</h2>
      </div>
      <div class="text">
        <a href="../A7med/A7med.html">Home</a>
        <a href="../A7med2/A7med2.html" >Rates</a>
        <a href="../contact us/contact us.html">Contact Us</a>
      </div>
     <div >
        <a href="../sign-up/sign-up.html">
        <button>Sign in</button>
      </a>
      </div>
    </div>
  
    <button id="open-add" class="btn">✚ Add Anime</button>
  <main>
    <table class="animes-table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Evaluation</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="tbody-data"></tbody>
    </table> 
  </main>
  
  <div id="modal" class="modal" aria-hidden="true">
    <div class="modal-content" role="dialog" aria-modal="true">
      <h3 id="modal-title">Add Anime</h3>

      <form id="anime-form">
        <label>
          Name
          <input id="name" name="name" type="text" required />
        </label>

        <label>
          Evaluation (1.0 - 10.0)
          <input id="evaluation" name="evaluation" type="number" step="0.1" min="1" max="10" required />
        </label>

        <div class="modal-actions">
          <button type="submit" id="save-btn" class="btn primary">Save</button>
          <button type="button" id="cancel-btn" class="btn">Cancel</button>
        </div>
      </form>
    </div>
 </div>

  <script src="A7med2.js"></script>
</body>
</html>
