<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <link rel="stylesheet" href="forget.css">
</head>
<body>
    <div class="reset_page">
    <h1>Forgot Password</h1>
    <p class="resetPar">Plaese enter your email address to reset your password</p>

    <form action="../sign-up/sign-up.html" method="get" id="myForm">
        <div class="input_box">
            <input type="email" placeholder="Enter your E-mail" id="email" required>
        </div>
        <button type="submit" class="btn">Reset</button>
        <p class="back">
        <a href="../sign-up/sign-up.html">Back to sign in</a>
        </p>
    </form>
    
<script>
document.getElementById("myForm").addEventListener("submit", function(event) {
    

    if (!this.checkValidity()) {
        this.reportValidity();
        return;
    }
    alert("Your password has been reset successfully to 123");
});
</script>
    
</body>
</html>
